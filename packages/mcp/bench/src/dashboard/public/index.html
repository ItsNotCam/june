<!doctype html>
<!-- author: Claude -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>june · RSI bench</title>
    <link rel="stylesheet" href="/static/style.css" />
    <!-- Set the saved theme before first paint to avoid a flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("june-bench-theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <!-- Chart.js + annotation plugin from CDN (needs network on first load). -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
    <!-- Markdown renderer for summary.md (GFM tables). -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">june</span>
        <span class="sep">·</span>
        <span class="title">RSI bench</span>
        <span class="tagline">the gauge — never the goal</span>
      </div>
      <div class="topbar-right">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light/dark theme" title="Toggle light/dark theme">
          <span class="theme-icon theme-icon-dark" aria-hidden="true">☾</span>
          <span class="theme-icon theme-icon-light" aria-hidden="true">☀</span>
        </button>
        <div class="status" id="live-status" data-state="idle">
          <span class="dot"></span><span class="label">connecting…</span>
        </div>
      </div>
    </header>

    <div class="layout">
    <main>
      <!-- Live log tail + stage progress of the active run (hidden when idle) -->
      <section class="card logcard" id="logcard" hidden>
        <div class="card-head">
          <h2>Live log</h2>
          <div class="log-controls">
            <span class="muted" id="log-meta"></span>
            <label class="log-follow"><input type="checkbox" id="log-follow" checked /> follow</label>
          </div>
        </div>
        <!-- Stage progress bar: one dot per benchmark stage; the fill jumps dot
             to dot as the run advances along the pipeline. -->
        <div class="stage-progress" id="stage-progress" hidden></div>
        <pre class="logview" id="logview"><span class="empty">waiting for run.log…</span></pre>
      </section>

      <!-- Trend -->
      <section class="card">
        <div class="card-head">
          <h2>Performance over time</h2>
          <div class="controls">
            <label>fixture
              <select id="fixture-select"></select>
            </label>
            <label>mode
              <select id="mode-select">
                <option value="control" selected>control (gemma4:26b — the bar)</option>
                <option value="iterate">iterate (flash — scratchpad)</option>
                <option value="all">all</option>
              </select>
            </label>
            <label>view
              <select id="view-select">
                <option value="overall" selected>overall</option>
                <option value="per-tier">per-tier correct</option>
              </select>
            </label>
          </div>
        </div>
        <div class="series-toggle" id="series-toggle"></div>
        <div class="chart-wrap"><canvas id="trend"></canvas></div>
        <p class="note" id="trend-note"></p>
      </section>

      <!-- Gate -->
      <section class="card" id="gate-card">
        <div class="card-head"><h2>Golden gate</h2><span class="muted" id="gate-meta"></span></div>
        <div id="gate-body"></div>
      </section>

      <!-- Runs table -->
      <section class="card">
        <div class="card-head"><h2>Runs</h2><span class="muted" id="runs-meta"></span></div>
        <div class="table-wrap">
          <table id="runs-table">
            <thead>
              <tr>
                <th>when</th><th>mode</th><th>kind</th><th>reader</th><th>judge</th>
                <th class="num">correct%</th><th class="num">recall@5</th><th class="num">mrr</th>
                <th>status</th><th class="num">cost</th>
              </tr>
            </thead>
            <tbody id="runs-body"></tbody>
          </table>
        </div>
      </section>
    </main>

      <!-- Run detail — persistent right-hand column -->
      <aside class="detail" id="detail">
        <div class="detail-head">
          <h2 id="detail-title">Run detail</h2>
          <span class="muted" id="detail-sub"></span>
        </div>
        <div class="detail-body" id="detail-body"><p class="empty">Select a run from the table.</p></div>
      </aside>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
