<!doctype html>
<!-- author: Claude -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>june · RSI bench</title>
    <link rel="stylesheet" href="/static/style.css" />
    <!-- Chart.js + annotation plugin from CDN (needs network on first load). -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">june</span>
        <span class="sep">·</span>
        <span class="title">RSI bench</span>
        <span class="tagline">the gauge — never the goal</span>
      </div>
      <div class="status" id="live-status" data-state="idle">
        <span class="dot"></span><span class="label">connecting…</span>
      </div>
    </header>

    <main>
      <!-- In-flight run progress (shown only while a run is executing) -->
      <section class="card inflight" id="inflight" hidden>
        <div class="card-head">
          <h2>Run in progress</h2>
          <span class="muted" id="inflight-meta"></span>
        </div>
        <ol class="stages" id="stage-list"></ol>
      </section>

      <!-- Trend -->
      <section class="card">
        <div class="card-head">
          <h2>Performance over time</h2>
          <div class="controls">
            <label>fixture
              <select id="fixture-select"></select>
            </label>
            <label>mode
              <select id="mode-select">
                <option value="control" selected>control (gemma4:26b — the bar)</option>
                <option value="iterate">iterate (flash — scratchpad)</option>
                <option value="all">all</option>
              </select>
            </label>
            <label>view
              <select id="view-select">
                <option value="overall" selected>overall</option>
                <option value="per-tier">per-tier correct</option>
              </select>
            </label>
          </div>
        </div>
        <div class="series-toggle" id="series-toggle"></div>
        <div class="chart-wrap"><canvas id="trend"></canvas></div>
        <p class="note" id="trend-note"></p>
      </section>

      <!-- Gate -->
      <section class="card" id="gate-card">
        <div class="card-head"><h2>Golden gate</h2><span class="muted" id="gate-meta"></span></div>
        <div id="gate-body"></div>
      </section>

      <!-- Runs table -->
      <section class="card">
        <div class="card-head"><h2>Runs</h2><span class="muted" id="runs-meta"></span></div>
        <div class="table-wrap">
          <table id="runs-table">
            <thead>
              <tr>
                <th>when</th><th>mode</th><th>kind</th><th>reader</th><th>judge</th>
                <th class="num">correct%</th><th class="num">recall@5</th><th class="num">mrr</th>
                <th>status</th><th class="num">cost</th>
              </tr>
            </thead>
            <tbody id="runs-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- Detail drawer -->
    <div class="drawer-scrim" id="drawer-scrim" hidden></div>
    <aside class="drawer" id="drawer" hidden>
      <div class="drawer-head">
        <h2 id="drawer-title">Run detail</h2>
        <button class="close" id="drawer-close" aria-label="close">×</button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>

    <script src="/static/app.js"></script>
  </body>
</html>
