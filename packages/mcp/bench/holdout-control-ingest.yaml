# Ingest tunables for the SEALED real-doc holdout under --mode control (gemma4:26b).
#
# Pass with: june-eval run-holdout fixtures/holdout-real --mode control \
#              --ingest-config holdout-control-ingest.yaml
#
# WHY: the control summarizer is gemma4:26b (~the whole 24GB VRAM budget). The
# ingest summarizer runs per-chunk LLM calls with `summarizer.concurrency` in
# flight; the schema default (4) means FOUR parallel 26B contexts, whose KV-caches
# overflow 24GB → Ollama offloads/queues → OllamaTimeoutError thrash. Serialize to
# one resident context. Pairs with the two-phase ingest (summarize-all → embed-all)
# that keeps the embedder out of VRAM during summarization. Host tuning, not a
# committed default — small summarizers can keep concurrency high.
summarizer:
  concurrency: 1
  # Summarizer = gemma4:26b — the REFERENCE model. A baseline must use the strongest
  # model for the summaries, not a lighter stand-in. gemma4:26b fits 100% on the 24GB
  # RTX 3090 *when the GPU is free* (validated ~2s/chunk, 0 rejects on real docs); the
  # earlier "doesn't fit / slow" was Stable Diffusion squatting ~7GB — close other GPU
  # tenants before a cert run. (qwen3:14b remains a proven fast fallback for VRAM-tight
  # hosts — set ollama_model: qwen3:14b — but it is NOT the reference baseline.)
  ollama_model: gemma4:26b
  # No fallback on a certification ingest. If a chunk can't get a real model summary
  # after all retries, HARD-FAIL the run instead of shipping a heading-path template
  # — a non-model summary would silently contaminate the holdout eval ("muddy the
  # waters"). Output is also schema-FORCED (Ollama structured outputs) + think:false,
  # so a thinking model can't emit an empty {} and a bad decode can't be unparseable.
  # The run then either certifies a 100%-real-summary corpus or aborts loudly.
  on_failure: error

# Host resilience (now belt-and-suspenders — qwen3:14b fits fully on GPU, so the
# cold-reload/eviction stalls below no longer apply to the summarizer; kept as cheap
# insurance and because the gemma4:26b READER phase can still cold-load). History,
# for the record: gemma4:26b as summarizer ran ~25% on CPU and its "intermittent
# hangs" were ~18s VRAM-eviction cold reloads (load_duration ≈ 18s; warm ~2.7s) —
# which is exactly why the summarizer was moved to qwen3:14b above.
#   - summarizer_timeout_ms: keep the schema default 60000 (NOT the earlier 30000). 60s
#     comfortably absorbs an ~18s cold reload while still abandoning a truly dead request.
#     The earlier 30s was set on the wrong "wedge" diagnosis and had no margin over a
#     reload → it tripped → degraded template fallback. The summarizer also now pins
#     keep_alive ("30m") and escalates a post-timeout retry to first_call_timeout_ms
#     (300s) for the rare load-under-contention case — see summarizer/ollama.ts.
#   - summarizer_retry_max_attempts 3 -> 5: a transient cluster of reloads/contention
#     can't cascade to a degraded fallback summary — unacceptable on a certification run.
# Best fix is operational: run the cert ingest against a **dedicated** gemma host (sole
# VRAM tenant) so the cold-load happens once (covered by first_call_timeout_ms) and
# residual timeouts go to ~0. Not a committed june default; host tuning for this run.
ollama:
  summarizer_timeout_ms: 60000
  summarizer_retry_max_attempts: 5
  # gemma4:26b is natively a 262K-context model; give it a comfortable window. It fits
  # 100% on the 24GB 3090 at 32K when the GPU is free, and the schema-default 8192 is an
  # unnecessary squeeze for the reference summarizer. (8192 is fine for smaller models.)
  summarizer_num_ctx: 32768
