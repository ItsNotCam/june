# june-eval configuration reference (§29.2).
#
# Every field below is what ships; `config.yaml` only needs to contain
# the overrides. Discovery order: --config > CONFIG_PATH env > ./config.yaml
# > shipped defaults.

schema_version: 1

roles:
  # Role 1 — corpus author. Renders planted facts into natural technical prose.
  # Defaults to anthropic for quality; operators may swap providers at the
  # cost of the L1 defense if role 1 and role 2 share a provider.
  corpus_author:
    provider: anthropic
    model: claude-sonnet-4-6
    max_tokens: 4000
    # Max in-flight calls. Size for the active provider — Ollama saturates
    # ~1–2 on consumer GPUs; hosted providers tolerate more.
    concurrency: 4

  # Role 2 — query author. Defaults to OpenAI (different provider than role 1)
  # to reduce the lexical-collusion threat (L1).
  query_author:
    provider: anthropic
    model: claude-sonnet-4-6
    # One call emits up to ~50 queries in a single JSON object (~7-8K chars
    # at ~150 chars/query). 2000 tokens truncated T2/T3/T4 mid-array.
    max_tokens: 8000
    concurrency: 4

  # Role 3 — reader (the system under test). Temperature locked to 0 in practice;
  # any nonzero value warns at config load (L8).
  reader:
    provider: deepseek
    # deepseek-v4-flash (hosted) — frozen for the reader-prompt A/B (T4 bridge
    # composition). It was the prior baseline reader (run 2FNP8QQH) and is a
    # strong instruction-follower, so the two-hop instruction is exercised on a
    # capable model rather than confounded by an 8B's weaker compliance. Vary
    # only prompts/reader.md across the two arms; keep this model fixed.
    model: deepseek-v4-flash
    max_tokens: 1024
    temperature: 0
    concurrency: 8

  # Role 4 — judge. Default `external`: the bench emits judge_tasks.json and calls
  # NO judge LLM; the Claude Code RSI orchestrator's Sonnet agents grade them
  # out-of-process (no API calls). See JUDGE-RUNNER.md. The legacy in-bench judges
  # (anthropic-batch | deepseek) stay selectable via --judge-provider; model /
  # max_tokens / temperature / concurrency below apply only to those paths.
  judge:
    provider: external
    model: deepseek-v4-pro
    max_tokens: 512
    temperature: 0             # in-bench judge only; locked to 0; ignored by external
    concurrency: 8             # sync (deepseek) path only; ignored by external/anthropic-batch

corpus:
  max_facts_per_doc: 15
  max_retries: 3

queries:
  counts:
    T1: 50
    T2: 50
    T3: 40
    T4: 40
    T5: 70
  max_total: 500              # hard ceiling per Q2

anti_leakage:
  threshold: 0.40
  max_retries: 3

resolution:
  embedding_threshold: 0.85
  max_unresolved_pct: 0.02
  max_embedding_pct: 0.20

retrieval:
  adapter: stopgap            # stopgap | june-api (when june exposes one)
  k_values: [1, 3, 5, 10]
  retriever_config:
    fusion: rrf
    dense_weight: 0.6
    bm25_weight: 0.4
    rank_constant: 60         # RRF k; literature convention. Changing this flags
                              # runs incomparable to prior runs (I-EVAL-3).
  multi_hop:
    enabled: true               # "Anchored bridge injection" (see multi-hop.ts).
                                # Anchors on the original query (which surfaces the
                                # relational chunk ~95% — measured), resolves the
                                # bridge entity B from THAT ranking's top chunks
                                # (not a rephrased hop), retrieves the atomic
                                # sub-query naming B, and INJECTS its best novel
                                # chunk into the reader window without demoting any
                                # base chunk — so single-pass is a strict floor.
                                # Replaces the old decompose+RRF design, which
                                # measured WORSE (T4 30.0%→12.5%): bridge extraction
                                # failed ~70% off a weak rephrased hop, and RRF
                                # demoted the atomic chunk. Headline metric is T4
                                # recall@5; T4 correct% is reader-bound (perfect
                                # retrieval still scored 12/12 PARTIAL) and is the
                                # next, separate piece of work. Planner is off-box
                                # deepseek to avoid the embed↔chat GPU-swap 504 a
                                # local planner caused; all failure paths degrade to
                                # single-hop.
    planner:
      # RSI: the harness uses ONLY local Ollama (never a hosted API). The old
      # off-box deepseek planner broke the no-API rule. Local 8B is plenty for
      # bridge-entity extraction; with the GPU free (no SD) the embed↔chat swap
      # is fine, and any planner failure degrades to single-pass (never an error).
      provider: ollama
      model: llama3.1:latest
      max_tokens: 512
  rerank:
    enabled: false              # OFF by default — the synthetic fixture's fictional
                                # protocol names neutralize a cross-encoder (it ranks
                                # right-section/wrong-protocol), regressing T2/T3
                                # recall@5. Code is built+tested; this gauge can't
                                # fairly measure a reranker. Second-pass reranker — see
                                # src/retriever/reranker.ts. Rescores a deep pool
                                # and returns top-k by relevance; targets the
                                # "recall present, ranking weak" gap (recall@1 ≪
                                # recall@10). Order-only, so it's a strict
                                # ranking refinement of the inner pool.
    pool_k: 40                  # candidate-pool depth; MUST be >= max(k_values).
    scorer:
      kind: cross-encoder
      model: Xenova/bge-reranker-base

reader_eval:
  k: 5

judge:
  batch_timeout_ms: 86400000   # 24h
  poll_initial_ms: 30000
  poll_max_ms: 300000
  max_unjudged_pct: 0.05

scoring:
  bootstrap_iterations: 1000
  ci_percentiles: [2.5, 97.5]

baseline:
  no_rag_opus: true           # when true, runs a sibling reader pass against
                               # an Opus model with empty retrieved context.
  provider: anthropic          # only "anthropic" in v1.
  model: claude-sonnet-4-6
  max_tokens: 1024

ingest:
  scratch_root: ./state/scratch  # was ./bench-scratch — consolidated under state/.
  keep_store_on_success: false
  confirm_qdrant_host: true    # interactive confirm on first run against a new QDRANT_URL.

cost:
  max_budget_usd: 5.00
  estimates:
    corpus_author:
      input_per_doc: 3000
      output_per_doc: 10000
    query_author:
      input_per_query: 500
      output_per_query: 200
    reader:
      input_per_query: 2000
      output_per_query: 300
    judge:
      input_per_query: 800
      output_per_query: 200

caching:
  enabled: false               # L13: off by default; flagged in manifest if on
  cache_root: ./state/cache/llm  # one subdir per provider; SHA-256 keyed JSON files

log:
  level: info
  output: stdout
  pretty: true                # true = colored human-readable console output;
                               # --log-json overrides to JSON regardless.
